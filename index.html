<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="末日黎明">
<title>末日黎明：喪屍浩劫</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>


<div id="app">


  <div id="setup-screen" class="screen">
    <div class="setup-box">
      <h1 class="setup-title">末日黎明</h1>
      <p class="setup-subtitle">喪屍浩劫 · 生存協議</p>


      <div class="setup-field">
        <label for="provider-select">AI 服務供應商</label>
        <select id="provider-select" class="provider-select"></select>
      </div>


      <div class="setup-field">
        <label for="api-key-input">API 金鑰</label>
        <input type="password" id="api-key-input" placeholder="貼上對應供應商的 API 金鑰" autocomplete="off">
        <p class="setup-hint">金鑰依供應商分別儲存於本機瀏覽器，不會上傳到任何伺服器。</p>
      </div>


      <button id="char-setup-toggle" class="collapse-btn" type="button">
        <span>👤 角色初始設定（選填）</span>
        <span class="collapse-arrow">▾</span>
      </button>
      <div id="char-setup-fields" class="collapse-body hidden">
        <div class="setup-field">
          <label for="char-gender-input">性別</label>
          <select id="char-gender-input">
            <option value="">不指定</option>
            <option value="男性">男性</option>
            <option value="女性">女性</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <div class="setup-field">
          <label for="char-location-input">末日爆發時所在位置</label>
          <input type="text" id="char-location-input" placeholder="例如：大學宿舍、醫院、郊區獨立屋" maxlength="30">
        </div>
        <div class="setup-field">
          <label for="char-occupation-input">末世前職業</label>
          <input type="text" id="char-occupation-input" placeholder="例如：軍警、醫護、學生、工程師" maxlength="30">
        </div>
        <div class="setup-field">
          <label for="char-name-input">角色姓名（選填）</label>
          <input type="text" id="char-name-input" placeholder="留空則由AI自動生成" maxlength="20">
        </div>
      </div>


      <button id="start-game-btn" class="btn-primary" type="button">進入末日</button>


      <div class="setup-divider">或</div>


      <button id="import-save-btn" class="btn-secondary" type="button">匯入存檔繼續遊玩</button>
      <input type="file" id="import-save-file" accept=".json" hidden>


      <button id="rules-link-btn" class="btn-link" type="button">📖 查看遊戲規則說明</button>


      <button id="test-mode-btn" class="btn-test hidden" type="button">🧪 離線測試模式（不消耗API配額）</button>
    </div>
  </div>


  <div id="game-screen" class="screen hidden">


    <header id="status-bar">
      <div class="status-row">
        <span id="status-time" class="status-item">⏱ 第1天 06:00</span>
        <span id="status-location" class="status-item">📍 未知地點</span>
        <button id="status-expand-btn" class="icon-btn" aria-label="展開狀態" type="button">▾</button>
        <button id="panels-toggle-btn" class="icon-btn" aria-label="物品與人物" type="button">📋</button>
        <button id="menu-toggle-btn" class="icon-btn" aria-label="選單" type="button">⚙</button>
      </div>
      <div class="status-row">
        <div class="stamina-wrapper">
          <span class="stamina-label">體力</span>
          <div class="stamina-bar-bg">
            <div id="stamina-bar-fill" class="stamina-bar-fill" style="width:100%"></div>
          </div>
          <span id="stamina-value" class="stamina-value">100</span>
        </div>
        <div class="stamina-wrapper">
          <span class="stamina-label">飽食</span>
          <div class="stamina-bar-bg">
            <div id="hunger-bar-fill" class="stamina-bar-fill" style="width:100%"></div>
          </div>
          <span id="hunger-value" class="stamina-value">100</span>
        </div>
        <span id="injury-tag" class="injury-tag hidden">輕傷</span>
        <span id="status-danger" class="danger-tag safe">安全</span>
      </div>
    </header>

    <div id="status-panel-full" class="status-panel-full hidden">
      <div class="panel-full-grid">
        <div class="panel-full-item">
          <span class="panel-label">性別</span><span id="stat-gender"></span>
        </div>
        <div class="panel-full-item">
          <span class="panel-label">人性值</span><span id="stat-humanity">--</span>
        </div>

        <div id="panel-item-faction" class="panel-full-item panel-full-item-wide hidden">
          <span class="panel-label">陣營信任</span><span id="stat-faction">--</span>
        </div>

        <div id="panel-item-awakening" class="panel-full-item panel-full-item-wide hidden">
          <span class="panel-label">覺醒進度</span><span id="stat-awakening"></span>
        </div>

        <div class="panel-full-item">
          <span class="panel-label">天氣</span><span id="stat-weather">--</span>
        </div>
        <div class="panel-full-item">
          <span class="panel-label">隨行隊員</span><span id="stat-companions"></span>
        </div>
      </div>
    </div>

    <main id="narrative-log">
      <div id="narrative-content"></div>
      <div id="typing-indicator" class="typing-indicator hidden">
        <span></span><span></span><span></span>
      </div>
    </main>


    <footer id="action-panel">
      <button id="action-collapsed-bar" class="action-collapsed-bar hidden" type="button">▾ 展開行動選項</button>


      <button id="options-collapse-toggle" class="collapse-toggle-btn hidden" type="button">
        <span>行動選項</span>
        <span class="collapse-arrow">▾</span>
      </button>
      <div id="options-container" class="options-container"></div>


      <div id="free-input-row" class="free-input-row hidden">
        <input type="text" id="free-input-text" placeholder="輸入你的行動…" maxlength="200">
        <button id="free-input-send" class="btn-send" type="button">送出</button>
        <button id="free-input-cancel" class="icon-btn" type="button">✕</button>
      </div>


      <button id="free-input-toggle" class="btn-free-toggle" type="button">✏ 自訂行動</button>
    </footer>


  </div>


  <div id="side-menu" class="side-menu hidden">
    <div id="side-menu-backdrop" class="side-menu-backdrop"></div>
    <div class="side-menu-content">
      <h2>選單</h2>


      <div class="menu-section-label">存檔管理</div>
      <button id="menu-named-save-btn" class="btn-menu" type="button">💾 建立命名存檔</button>
      <button id="menu-save-manager-btn" class="btn-menu" type="button">📂 讀取存檔（本機／雲端）</button>
      <button id="menu-export-btn" class="btn-menu" type="button">📤 匯出存檔為檔案</button>
      <button id="menu-import-btn" class="btn-menu" type="button">📥 匯入存檔檔案</button>


      <div class="menu-section-label">遊戲設定</div>
      <button id="menu-rules-btn" class="btn-menu" type="button">📖 遊戲規則說明</button>
      <button id="menu-apikey-btn" class="btn-menu" type="button">🔑 更改 API 金鑰</button>
      <button id="menu-restart-btn" class="btn-menu btn-danger" type="button">🔄 重新開始（清空進度）</button>


      <button id="notion-setup-toggle" class="collapse-toggle-btn" type="button">
        <span>☁ Notion 雲端同步（選填）</span>
        <span class="collapse-arrow">▾</span>
      </button>
      <div id="notion-setup-fields" class="collapse-body hidden">
        <div class="setup-field">
          <label for="notion-proxy-input">Cloudflare Workers 轉發網址</label>
          <input type="text" id="notion-proxy-input" placeholder="https://your-worker.workers.dev">
        </div>
        <div class="setup-field">
          <label for="notion-db-input">Notion Database ID</label>
          <input type="text" id="notion-db-input" placeholder="貼上資料庫ID">
        </div>
        <button id="notion-save-btn" class="btn-secondary" type="button">儲存 Notion 設定</button>
        <button id="notion-sync-now-btn" class="btn-secondary" type="button">立即測試同步</button>
        <p class="setup-hint">尚未部署轉發層前，留空即可，遊戲僅使用本機存檔。啟用後每10回合自動同步一次。可在「讀取存檔」中切換至雲端標籤讀回任一筆記錄。</p>
      </div>


      <div class="side-menu-footer">
        <button id="menu-close-btn" class="btn-secondary" type="button">關閉</button>
      </div>
    </div>
  </div>

  <div id="info-panel" class="side-menu hidden">
    <div id="info-panel-backdrop" class="side-menu-backdrop"></div>
    <div class="side-menu-content">
      <h2>物品與人物</h2>
  
      <!-- 分類一：物品（隨身背包 + 所有暫存點，手風琴式） -->
      <button id="items-section-toggle" class="collapse-toggle-btn" type="button">
        <span>🎒 物品</span>
        <span class="collapse-arrow">▾</span>
      </button>
      <div id="items-section-body" class="collapse-body hidden">
        <div id="items-accordion" class="items-accordion"></div>
      </div>
  
      <!-- 分類二：人物檔案 -->
      <button id="npc-section-toggle" class="collapse-toggle-btn npc-section" type="button">
        <span>📇 人物檔案（0）</span>
        <span class="collapse-arrow">▾</span>
      </button>
      <div id="npc-section-body" class="collapse-body hidden">
        <div id="npc-list" class="npc-list"></div>
      </div>
  
      <!-- 分類三：載具 -->
      <button id="vehicle-section-toggle" class="collapse-toggle-btn vehicle-section" type="button">
        <span>🚗 載具（0）</span>
        <span class="collapse-arrow">▾</span>
      </button>
      <div id="vehicle-section-body" class="collapse-body hidden">
        <div id="vehicle-list" class="vehicle-list"></div>
      </div>
  
      <div class="side-menu-footer">
        <button id="info-panel-close" class="btn-secondary" type="button">關閉</button>
      </div>
    </div>
  </div>


  <div id="named-save-modal" class="named-save-modal hidden">
    <div class="named-save-modal-content">
      <div class="rules-modal-header">
        <h2>讀取存檔</h2>
        <button id="named-save-close" class="icon-btn" type="button">✕</button>
      </div>
      <div class="save-source-tabs">
        <button id="save-tab-local" class="save-tab-btn active" type="button">💻 本機存檔</button>
        <button id="save-tab-notion" class="save-tab-btn" type="button">☁ Notion雲端</button>
      </div>
      <div id="named-save-list" class="named-save-list"></div>
    </div>
  </div>


  <div id="rules-modal" class="rules-modal hidden">
    <div class="rules-modal-content">
      <div class="rules-modal-header">
        <h2>遊戲規則說明</h2>
        <button id="rules-modal-close" class="icon-btn" type="button">✕</button>
      </div>
      <div id="rules-modal-content" class="rules-modal-body"></div>
    </div>
  </div>


  <div id="event-modal" class="event-modal hidden">
    <div class="event-modal-content">
      <div id="event-modal-icon" class="event-modal-icon">⚡</div>
      <h2 id="event-modal-title">異能覺醒</h2>
      <p id="event-modal-text"></p>
      <button id="event-modal-close" class="btn-primary" type="button">繼續</button>
    </div>
  </div>


  <div id="death-screen" class="death-screen hidden">
    <div class="death-screen-content">
      <div class="death-icon">☠</div>
      <h2>末日終章</h2>
      <p class="death-text"></p>
      <button id="death-restart-btn" class="btn-primary" type="button" onclick="localStorage.removeItem('doomsday_dawn_save_v1'); location.reload();">重新開始</button>
    </div>
  </div>


  <div id="loading-overlay" class="loading-overlay hidden">
    <div class="loading-spinner"></div>
  </div>


</div>


<script src="test_script.js"></script>
<script src="config.js"></script>
<script src="world_memory.js"></script>
<script src="app-save.js"></script>
<script src="app-npc.js"></script>
<script src="app-inventory.js"></script>
<script src="app.js"></script>
</body>
</html>
